training:
  total_timesteps: 2000000
  n_envs: 3  # 3 environnements en parallèle (+1 process principal = 4, un par cœur physique).
             # Mesuré : GPU à 0.58% d'utilisation moyenne avant le fix de perf de l'env (goulot
             # CPU), 17.6% après avec n_envs=1 — encore beaucoup de marge VRAM (40% max sur 2 Go).
             # Monter au-delà de 3 risquerait de sursouscrire les 4 cœurs physiques.

  max_episode_steps: 20000  # ~14 jours de bougies 1m. Sans ça, un épisode dure ~367k steps
                             # sur le dataset 1 an actuel (plus long qu'un niveau entier de
                             # curriculum) : ep_rew_mean ne se peuple jamais et l'agent
                             # rejoue toujours exactement la même tranche de données.

  domain_randomization:
    enabled: true
    capital_variation_pct: 0.20
    fee_range: [0.0005, 0.0015]

  # SAC Hyperparameters
  sac:
    learning_rate: "linear_0.0007"   # Linear decay from 7e-4 → 0
    buffer_size: 300000              # Maintien d'un grand buffer dans la RAM (CPU) pour la diversité
    batch_size: 64                   # Crucial : Réduit à 64 pour que les calculs de gradients du gros réseau tiennent dans 2Go de VRAM
    gamma: 0.99
    tau: 0.005
    train_freq: 1
    gradient_steps: 1
    ent_coef: "auto_0.01"            # Auto-tuned with floor at 0.01 (prevents exploration collapse)
    target_entropy: "auto"
    policy_kwargs:
      net_arch: [1024, 1024, 512]    # Deeper network for complex market patterns
    
  ppo:
    learning_rate: 0.0003            # Constant learning rate for stability
    n_steps: 4096                    # Doublé (était 2048) : la VRAM n'était utilisée qu'à 40% max,
                                      # de la marge pour des batches de gradient plus gros par mise à jour
    batch_size: 256                  # Doublé (était 128), toujours dans les 2 Go de VRAM disponibles
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.01
    target_kl: 0.02                  # Stoppe une époque de mise à jour dès que la divergence KL
                                      # moyenne dépasse ce seuil. Sans ça, rien n'empêchait des mises
                                      # à jour catastrophiques : approx_kl a atteint 0.55-0.61 sur les
                                      # runs de validation (une valeur saine tourne autour de 0.01-0.03).
    policy_kwargs:
      net_arch: [256, 256]           # Medium-sized network to prevent overfitting on 1m noise

data:
  lookback_window: 60               # 60 candles at 1m = 1h of context
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

market:
  exchange: binance
  pairs:
    - BTC/USDT
  timeframe: 1m
  history_years: 1

fees:
  maker: 0.001                    # 0.10% — taux Binance standard, sans remise BNB. Confirmé
  taker: 0.001                    # 0.10%   réaliste le 25/09/2026 par relevé des frais actuels
                                   # (Binance/Bybit 0.10%, OKX 0.08%/0.10%, Kraken 0.40%/0.80%,
                                   # Coinbase US 0.50%/0.90%) : Binance/Bybit/OKX dominent le
                                   # volume algo précisément parce que leurs frais sont bas — un
                                   # vrai bot n'utiliserait pas Kraken/Coinbase. Le run L2 à
                                   # cooldown_steps=500 (25/09) a déjà prouvé ce taux survivable
                                   # une fois le turnover maîtrisé (+7.29%, PF 1.909) ; la marge de
                                   # sécurité vient de corriger le turnover, pas de gonfler le frais.
                                   # NB : training/curriculum.py::set_curriculum_level() surcharge
                                   # ces valeurs par niveau — c'est là qu'il faut aussi les changer.

action:
  dead_zone: 0.1  # Doublé (était 0.05). Avec train/std maintenu sain par target_kl (~1.0,
                   # ne s'effondre plus), la quasi-totalité des actions échantillonnées tombait
                   # hors d'une zone "hold" aussi étroite : ~11 800-12 000 trades par rollout de
                   # 12 288 steps mesurés en L1/L2/L3 (~97% des steps), qu'il y ait des frais ou
                   # non. Cf. README Phase 5.D (déjà anticipé).
  cooldown_steps: 200                # Sweep du 25/09 (eval seule, sans réentraîner, sur le modèle
                                      # entraîné à 500) : 50→-3.29%/Sharpe-0.96, 100→+2.25%/0.82,
                                      # 200→+13.38%/Sharpe 4.12/PF 2.28 (392 trades, meilleur Sharpe
                                      # parmi les échantillons statistiquement crédibles), 300→+7.42%,
                                      # 500→+8.76%, 750-2500→+10-13% avec Sharpe croissant mais de
                                      # moins en moins de trades, 4000→+20.53%/100% win_rate/PF=inf
                                      # (écarté : n=20 trades, artefact — dégénère vers un quasi
                                      # Buy&Hold sur une fenêtre test haussière, pas un edge réel).
                                      # 200 retenu et baked-in pour réentraînement complet de
                                      # confirmation. Cf. Next_step.md 4.11.
  max_position_pct: 0.25            # Max 25% of capital per single trade

observation:
  features:
    - rsi
    - macd
    - atr
    - bollinger
    - obv
    - adx
    - cci
    - sma
    - ema
    - log_return
    - volatility
  
  multi_timeframe:
    enabled: true
    source_tf: "1m"
    target_tfs: ["5m", "15m", "1h"]  # Adjusted for 1m base timeframe
    features: ["rsi", "ema_200_direction", "atr"]

  sentiment:
    fear_and_greed: true

reward:
  fee_penalty_weight: 150.0         # 20->150 (25/09, piste 2). Sweep de dead_zone (0.1->0.7,
                                     # cooldown=200 fixé) a montré que la policy sort une action
                                     # moyenne quasi-toujours proche des bornes ±1 en déterministe —
                                     # aucun seuil d'interprétation post-hoc ne peut la faire
                                     # trader moins, seul un signal plus fort PENDANT
                                     # l'entraînement le peut. x20 (précédent) n'avait qu'un effet
                                     # marginal à cooldown=200 (392/392 trades = plafond saturé).
                                     # x150 pour vérifier si un signal nettement plus fort pousse la
                                     # policy à produire des actions modérées plutôt que de compter
                                     # uniquement sur le throttle externe — à valider empiriquement,
                                     # comme le reste. Cf. Next_step.md 4.12.
  volatility_penalty: 0.1
  unrealized_pnl_weight: 0.1        # Reward agent for holding winning positions
  reward_scale: 100.0               # Scale rewards to avoid very large cumulative values
  drawdown_penalty:
    enabled: true
    threshold_pct: 0.03             # Trigger at 3% drawdown (was 5%)
    penalty_factor: 5.0             # Stronger penalty (was 2.0)
  sharpe_bonus:
    enabled: true
    window: 100
    weight: 0.01
  trend_alignment_bonus:
    enabled: true
    weight: 0.005

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  models: "models"
  logs: "logs"

short:
  enabled: false                  # Off par défaut : L1-L3 inchangés. true pour le Niveau 4 uniquement.
  funding_rate_per_step: 0.000001 # ~0.024%/8h ramené au pas de 1 minute (ordre de grandeur d'un
                                   # funding rate réel de perpétuel BTC, historiquement ~0.01-0.03%/8h
                                   # sur Binance). Sans ce coût, l'agent apprendrait à shorter
                                   # gratuitement — ne transférerait pas à un usage réel.
  maintenance_margin_pct: 0.5     # Liquidation forcée si la perte latente atteint 50% de la valeur
                                   # notionnelle à l'entrée. Avec max_position_pct=0.25, pire cas
                                   # ≈ 12.5% du capital perdu par liquidation — borné.
  liquidation_penalty_pct: 0.01   # Coût supplémentaire à la liquidation forcée vs une clôture
                                   # volontaire, pour inciter l'agent à gérer son risque.
